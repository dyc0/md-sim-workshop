[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdsim"
version = "1.0.0"
description = "A small 2D molecular dynamics code for the Petnica workshop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "numba", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["mdsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
